# Replays every saved Kane flow (demo-app/.testmuai/tests/*_test.md) against Perch on each push/PR.
# Needs repo secrets KANE_USERNAME and KANE_ACCESS_KEY (optional: KANE_PROJECT_ID, KANE_FOLDER_ID).
name: Kane gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KANE_CLI_USER_AGENT: github-actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Kane CLI
        run: |
          npm install -g @testmuai/kane-cli
          kane-cli --version

      - name: Start Perch
        run: |
          node demo-app/server.mjs > perch.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4480/ > /dev/null; then echo "Perch is up on :4480"; exit 0; fi
            sleep 1
          done
          echo "::error::Perch did not start on port 4480"; cat perch.log; exit 1

      - name: Log in to Kane
        env:
          KANE_USERNAME: ${{ secrets.KANE_USERNAME }}
          KANE_ACCESS_KEY: ${{ secrets.KANE_ACCESS_KEY }}
          KANE_PROJECT_ID: ${{ secrets.KANE_PROJECT_ID }}
          KANE_FOLDER_ID: ${{ secrets.KANE_FOLDER_ID }}
        run: |
          if [ -z "$KANE_USERNAME" ] || [ -z "$KANE_ACCESS_KEY" ]; then
            echo "::error::Set the KANE_USERNAME and KANE_ACCESS_KEY repository secrets"; exit 1
          fi
          args=(--username "$KANE_USERNAME" --access-key "$KANE_ACCESS_KEY")
          if [ -n "$KANE_PROJECT_ID" ]; then args+=(--project-id "$KANE_PROJECT_ID"); fi
          if [ -n "$KANE_FOLDER_ID" ]; then args+=(--folder-id "$KANE_FOLDER_ID"); fi
          kane-cli login "${args[@]}" < /dev/null
          kane-cli whoami < /dev/null || true

      - name: Replay Kane flows
        run: node gate/kane-gate.mjs --check demo-app

      - name: Upload Kane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kane-evidence
          path: |
            demo-app/.testmuai/evidence
            .data/gate.ndjson
          if-no-files-found: ignore
